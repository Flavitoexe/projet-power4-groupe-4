{{define "game-end"}}
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/css/style.css">
        <title>Partie finie !</title>
    </head>
    <body>
        <div class="navigation">
            <div class="lien">
                <div class="spaceLien"><a href="/">Menu</a></div>
                <div><a href="/game/scoreboard">Scoreboard</a></div>
            </div>
            <div class="logo">
                <div>● ○ ●</div>
            </div>
        </div>
        <main>
            <h2>La partie est terminée !</h2>

            <div class="boite box_end">
                <div><h3>Résultat de la partie :</h3></div>
                {{if eq . "Egalité"}}
                <div>Dommage, il y a égalité pour cette partie !</div>
                {{else}}
                <div>Bravo {{.}}, tu as gagné !</div>
                {{end}}
            </div>
                
            <button type="button"><a href="/game/init">Relancer une partie</a></button>
            <button type="button"><a href="/game/replay">Revanche</a></button>
        </main>
    </body>
</html>
{{end}}
